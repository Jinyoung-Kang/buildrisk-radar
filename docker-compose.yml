# =============================================================================
# 건설·부동산 위험 모니터 로컬 스택 (NFR-10: docker compose 원커맨드, Apple Silicon)
#
#   db      PostgreSQL 16 + PostGIS 3.6 — Flyway(소유자 계정)가 스키마 생성, 앱은 최소 권한 계정 (ADR-014)
#   redis   조회 캐시 · 세션 · 레이트리밋 (비밀번호, 영속화 끔)
#   api     Spring Boot 4.1 — REST 만 (외부 API 키 없음). 배치 실행은 요청 큐에 넣기만 (ADR-012)
#   worker  같은 이미지 — 요청 큐 소비 · 스케줄 · 외부 API 호출 (키는 여기만)
#   web     Next.js 15 :3400 — 유일한 외부 진입점. /api · /swagger-ui 는 api 로 프록시
#   batch   (profile batch) 일회성 CLI 실행 — make batch-all / make job JOB=…
#   prometheus · grafana  (profile obs) — make obs
#
# 공개 포트는 127.0.0.1 에만 (NFR-07). api 는 포트를 열지 않습니다: X-Forwarded-For 를 믿는 프록시가 web 하나뿐이어야
# 레이트리밋·감사 로그의 클라이언트 IP 를 속일 수 없습니다. 관리 포트(8411: health · prometheus)는 내부망 전용.
# =============================================================================

x-app-env: &app-env
  DATABASE_URL: jdbc:postgresql://db:5432/buildrisk
  DATABASE_USER: buildrisk_app
  DATABASE_PASSWORD: ${DB_APP_PASSWORD:?make env 로 .env 를 채우세요}
  FLYWAY_USER: buildrisk
  FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-buildrisk}
  DB_APP_USER: buildrisk_app
  DB_APP_PASSWORD: ${DB_APP_PASSWORD:?make env 로 .env 를 채우세요}
  REDIS_URL: redis://:${REDIS_PASSWORD:?make env 로 .env 를 채우세요}@redis:6379
  ADMIN_TOKEN: ${ADMIN_TOKEN:-}
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
  TZ: Asia/Seoul

# 외부 API 키 — worker · batch 에만
x-api-keys: &api-keys
  DART_API_KEY: ${DART_API_KEY:-}
  KOSIS_API_KEY: ${KOSIS_API_KEY:-}
  REB_API_KEY: ${REB_API_KEY:-}
  SGIS_CONSUMER_KEY: ${SGIS_CONSUMER_KEY:-}
  SGIS_CONSUMER_SECRET: ${SGIS_CONSUMER_SECRET:-}
  VWORLD_API_KEY: ${VWORLD_API_KEY:-}
  VWORLD_DOMAIN: ${VWORLD_DOMAIN:-http://localhost:3400}
  DATA_GO_KR_KEY: ${DATA_GO_KR_KEY:-}
  DART_DAILY_CALL_LIMIT: ${DART_DAILY_CALL_LIMIT:-15000}
  DATA_GO_KR_DAILY_CALL_LIMIT: ${DATA_GO_KR_DAILY_CALL_LIMIT:-9000}
  FS_FROM_YEAR: ${FS_FROM_YEAR:-2021}
  BATCH_API_CONCURRENCY: ${BATCH_API_CONCURRENCY:-4}

# 컨테이너 하드닝: 읽기 전용 루트 · 모든 커널 권한 제거 · 권한 상승 금지
x-hardening: &hardening
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

x-mgmt-health: &mgmt-health
  test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8411 && printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
  interval: 10s
  timeout: 5s
  retries: 30
  start_period: 30s

services:
  db:
    restart: unless-stopped
    # arm64 네이티브. 공식 이미지로 바꾸려면: image: postgis/postgis:16-3.5 + platform: linux/amd64
    image: imresamu/postgis:16-3.6-bookworm
    environment:
      POSTGRES_USER: buildrisk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buildrisk}
      POSTGRES_DB: buildrisk
      LANG: C.UTF-8
      TZ: Asia/Seoul
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "work_mem=32MB", "-c", "log_min_duration_statement=500"]
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5472:5432"
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildrisk -d buildrisk"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?make env 로 .env 를 채우세요}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save '' --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru"]
    ports:
      - "127.0.0.1:6419:6379"
    <<: *hardening
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: app/Dockerfile
    image: buildrisk-radar-app
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      <<: *app-env
      BUILDRISK_ROLE: api
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ANALYST_USERNAME: ${ANALYST_USERNAME:-analyst}
      ANALYST_PASSWORD: ${ANALYST_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-1200}
    volumes:
      - ./seed:/app/seed:ro
    <<: *hardening
    healthcheck: *mgmt-health

  worker:
    restart: unless-stopped
    image: buildrisk-radar-app
    depends_on:
      api: { condition: service_healthy }       # 마이그레이션은 api 가 먼저 끝냄
    environment:
      <<: [*app-env, *api-keys]
      BUILDRISK_ROLE: worker
      BATCH_SCHEDULING_ENABLED: ${BATCH_SCHEDULING_ENABLED:-false}
    volumes:
      - ./seed:/app/seed:ro
    <<: *hardening
    healthcheck: *mgmt-health

  batch:
    profiles: ["batch"]
    image: buildrisk-radar-app
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      <<: [*app-env, *api-keys]
      SPRING_PROFILES_ACTIVE: batch-only
      BATCH_RUN_JOBS: ${JOBS:-all}
    volumes:
      - ./seed:/app/seed:ro
    <<: *hardening

  web:
    restart: unless-stopped
    build:
      context: ./web
      args:
        API_INTERNAL_BASE: http://api:8410
    depends_on:
      api: { condition: service_healthy }
    environment:
      NEXT_PUBLIC_KAKAO_JS_KEY: ${NEXT_PUBLIC_KAKAO_JS_KEY:-}
    ports:
      - "127.0.0.1:3400:3400"
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  # ---------------------------------------------------------------- 관측 (make obs)
  prometheus:
    profiles: ["obs"]
    image: prom/prometheus:v3.1.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    ports:
      - "127.0.0.1:9490:9090"
    security_opt: [no-new-privileges:true]

  grafana:
    profiles: ["obs"]
    image: grafana/grafana:11.4.0
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?make env 로 .env 를 채우세요}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3401:3000"
    security_opt: [no-new-privileges:true]

volumes:
  db-data:
  prom-data:
  grafana-data:
