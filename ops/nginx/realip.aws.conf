# AWS 배포 전용 (compose.aws.yml 이 /etc/nginx/edge.d/ 에 마운트, ADR-031)
# 앞단 Caddy 가 CloudFront 대역만 믿고 정한 클라이언트 IP 하나로 X-Forwarded-For 를 덮어써 보냄.
# edge 게시 포트는 127.0.0.1 에만 열려 같은 호스트의 Caddy 만 닿고, 그 연결은 도커 브리지 게이트웨이(사설 대역)에서 옴.
# realip 이 $remote_addr 를 그 값으로 바꾸므로 레이트리밋 · 로그인 잠금 · 감사 로그가 방문자마다 따로 셈.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
