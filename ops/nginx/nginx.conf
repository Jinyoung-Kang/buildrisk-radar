# edge — 유일한 외부 진입점 (ADR-013)
#   /api/v1 · /swagger-ui · /v3/api-docs → api,  그 밖(화면 · /api/config) → web
#   X-Forwarded-For 는 클라이언트가 보낸 값을 버리고 실제 접속 주소($remote_addr)로 덮어씀 —
#   api 는 이 프록시(고정 IP)만 믿으므로 레이트리밋 · 로그인 잠금 · 감사 로그의 IP 를 헤더 위조로 바꿀 수 없음
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
  server_tokens off;
  client_max_body_size 1m;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  # 클라이언트가 보낸 X-Forwarded-Host · Port 를 그대로 넘기지 않음 — api(Tomcat RemoteIpValve)가 edge 를 믿고
  # 요청 호스트로 쓰므로, 지금은 이 값을 쓰는 곳이 없어도 응답에 비칠 수 있는 길을 막아 둠.
  # Port 는 보내지 않음(빈 값 = 헤더 없음): $server_port 는 컨테이너 안의 8080 이라 밖에서 쓰는 포트가 아님 —
  # 없으면 api 는 scheme 의 기본 포트로 봄. api 는 요청의 호스트 · 포트로 절대 주소를 만들지 않음(Location · OpenAPI servers 모두 상대 경로)
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Port "";

  # api · web 은 이름이 아니라 compose 의 고정 IP 로 — 이름은 시작 때 한 번만 풀면 컨테이너를 다시 만든 뒤 옛 IP 로 보내 502 였고,
  # 도커 DNS 로 다시 풀게 하면 컨테이너가 없는 사이 호스트 DNS 가 'web' 을 127.0.53.53(ICANN 이름 충돌 주소)으로 답해 그 값을
  # 들고 있는 동안 502 였음(실측 약 4.5초). max_fails=0: 내려가 있던 사이의 실패로 올라온 뒤까지 '죽음'으로 표시해 두지 않음 (VERIFICATION 125)
  # 배포별 덧붙임(없으면 아무것도 안 함) — AWS 는 앞단 Caddy 의 X-Forwarded-For 를 믿는 realip 설정을 넣음 (ADR-031, compose.aws.yml).
  # realip 은 $remote_addr 자체를 바꾸므로 위의 'X-Forwarded-For $remote_addr' 덮어쓰기 · api 의 TRUSTED_PROXY_REGEX 는 그대로 둠
  include /etc/nginx/edge.d/*.conf;

  upstream api { server 10.213.0.11:8410 max_fails=0; keepalive 16; }
  upstream web { server 10.213.0.12:3400 max_fails=0; keepalive 16; }

  server {
    listen 8080;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    # 대소문자를 가리지 않고 api 로 — '/API/v1/…' 가 web 으로 가면 Next rewrite(대소문자 무시)가 api 로 넘기면서
    # api 가 보는 클라이언트 IP 가 web 컨테이너로 바뀌어 레이트리밋 · 로그인 잠금 · 감사 로그를 비켜 갔음 (VERIFICATION 111).
    # api(Spring)는 경로를 대소문자로 구분하므로 대문자 경로는 api 에서 거부됨. 끝 슬래시가 없는 '/api/v1' 도 api 로 (VERIFICATION 164)
    location ~* ^/api/v1(/|$) { proxy_pass http://api; }
    location ~* ^/swagger-ui { proxy_pass http://api; }
    location ~* ^/v3/api-docs { proxy_pass http://api; }
    location / { proxy_pass http://web; }
  }
}
