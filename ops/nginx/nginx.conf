# edge — 유일한 외부 진입점 (ADR-013)
#   /api/v1 · /swagger-ui · /v3/api-docs → api,  그 밖(화면 · /api/config) → web
#   X-Forwarded-For 는 클라이언트가 보낸 값을 버리고 실제 접속 주소($remote_addr)로 덮어씀 —
#   api 는 이 프록시(고정 IP)만 믿으므로 레이트리밋 · 로그인 잠금 · 감사 로그의 IP 를 헤더 위조로 바꿀 수 없음
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
  server_tokens off;
  client_max_body_size 1m;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;

  # 컨테이너를 다시 만들면 IP 가 바뀜 — 시작 때 한 번만 해석하면 옛 IP 로 보내 502 (실측). 도커 DNS 로 10초마다 다시 해석
  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream api { zone upstream_api 64k; server api:8410 resolve; keepalive 16; }
  upstream web { zone upstream_web 64k; server web:3400 resolve; keepalive 16; }

  server {
    listen 8080;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location /api/v1/ { proxy_pass http://api; }
    location /swagger-ui { proxy_pass http://api; }
    location /v3/api-docs { proxy_pass http://api; }
    location / { proxy_pass http://web; }
  }
}
