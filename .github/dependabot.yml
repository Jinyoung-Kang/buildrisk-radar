# 의존성 업데이트 PR — 주 1회, 묶어서 (보안 업데이트는 GitHub 이 즉시 따로 올림)
version: 2
updates:
  - package-ecosystem: gradle
    directory: /app
    schedule: { interval: weekly, day: monday }
    groups: { spring: { patterns: ["org.springframework*"] }, others: { patterns: ["*"], exclude-patterns: ["org.springframework*"] } }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    groups: { web: { patterns: ["*"] } }
  - package-ecosystem: docker
    directory: /app
    schedule: { interval: weekly, day: monday }
  - package-ecosystem: docker
    directory: /web
    schedule: { interval: weekly, day: monday }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
