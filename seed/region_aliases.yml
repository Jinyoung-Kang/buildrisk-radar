# 출처별 지역 이름 → 기준 시군구(ref.region) 매핑 보조 사전 (FR-405, ADR-005)
#
# 1) sido: 출처가 쓰는 시도 이름(약칭 포함) → 기준 경계(V-World)의 시도 이름 후보.
#    2026-07 광주·전남 통합처럼 출처와 경계의 시점이 다르면 후보를 여러 개 둡니다.
sido:
  서울: [서울특별시]
  부산: [부산광역시]
  대구: [대구광역시]
  인천: [인천광역시]
  광주: [광주광역시, 전남광주통합특별시]
  대전: [대전광역시]
  울산: [울산광역시]
  세종: [세종특별자치시]
  경기: [경기도]
  강원: [강원특별자치도, 강원도]
  충북: [충청북도]
  충남: [충청남도]
  전북: [전북특별자치도, 전라북도]
  전남: [전라남도, 전남광주통합특별시]
  전남광주: [광주광역시, 전라남도, 전남광주통합특별시]
  경북: [경상북도]
  경남: [경상남도]
  제주: [제주특별자치도]

# 2) SGIS 시도 코드(자체 체계) → 시도 약칭
sgis_sido:
  "11": 서울
  "21": 부산
  "22": 대구
  "23": 인천
  "24": 광주
  "25": 대전
  "26": 울산
  "29": 세종
  "31": 경기
  "32": 강원
  "33": 충북
  "34": 충남
  "35": 전북
  "36": 전남
  "37": 경북
  "38": 경남
  "39": 제주

# 3) 시군구 이름 표기 차이 (출처 표기 → 기준 표기)
names:
  세종시: 세종특별자치시

# 4) 수동 매핑·미매핑 사유. regionCd 가 있으면 이름 매칭보다 우선하고,
#    없으면 이름으로 찾지 못했을 때 붙이는 사유로만 씁니다 (경계가 최신이면 자연히 매핑됨).
#    source: KOSIS · RONE · SGIS,  name: '시도약칭 > 시군구' (출처 표기 그대로)
manual:
  - { source: KOSIS, name: "인천 > 영종구", note: "2026-07 인천 행정체제 개편 신설 구 — 경계 데이터에 아직 없음" }
  - { source: KOSIS, name: "인천 > 제물포구", note: "2026-07 인천 행정체제 개편 신설 구 — 경계 데이터에 아직 없음" }
  - { source: KOSIS, name: "인천 > 서해구", note: "2026-07 인천 행정체제 개편 신설 구 — 경계 데이터에 아직 없음" }
  - { source: KOSIS, name: "인천 > 검단구", note: "2026-07 인천 행정체제 개편 신설 구 — 경계 데이터에 아직 없음" }
  - { source: KOSIS, name: "인천 > 중구", note: "2026-07 개편으로 폐지된 구의 과거 시계열 — 현 경계(제물포구·영종구)와 1:1 대응 불가" }
  - { source: KOSIS, name: "인천 > 동구", note: "2026-07 개편으로 폐지된 구의 과거 시계열 — 현 경계(제물포구)와 1:1 대응 불가" }
  - { source: KOSIS, name: "인천 > 서구", note: "2026-07 개편으로 폐지된 구의 과거 시계열 — 현 경계(서해구·검단구)와 1:1 대응 불가" }
  - { source: SGIS, name: "인천 > 중구", note: "2026-07 개편으로 폐지(제물포구·영종구로 재편) — 2024 총가구를 새 구로 나눌 수 없음" }
  - { source: SGIS, name: "인천 > 동구", note: "2026-07 개편으로 폐지(제물포구로 통합) — 2024 총가구를 새 구로 나눌 수 없음" }
  - { source: SGIS, name: "인천 > 서구", note: "2026-07 개편으로 폐지(서해구·검단구로 재편) — 2024 총가구를 새 구로 나눌 수 없음" }
