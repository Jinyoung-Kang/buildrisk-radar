# 건설업 유니버스 (FR-103) — 기업개황 induty_code 가 아래 접두사로 시작하는 현재 상장사(유가 Y · 코스닥 K)
#   KSIC 10차: 41 종합 건설업(411 건물 · 412 토목)
#              421 기반조성 및 시설물 축조 관련 전문공사업 (토목 시공사 — 삼호개발·우원개발 등)
#   U-4 결정 (2026-09-24 실제 분포 확인): 422~424(전기·설비·실내건축 공사업)는 주택·PF 리스크와 거리가 멀어 제외.
#   분포는 GET /api/v1/mapping/unmapped 의 universe.byInduty 로 확인
include_prefixes:
